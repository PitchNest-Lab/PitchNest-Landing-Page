<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIP Survey - PitchNest</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Tailwind CSS CDN to power the utility classes used on this page -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-6">
  
  <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-8 md:p-12 border border-slate-100">
    <div id="surveyHeader">
      <div class="flex justify-center mb-8">
        <div class="w-12 h-12 bg-sky-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-sky-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>
      <div class="text-center mb-8">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-2">You're on the list!</h1>
        <p class="text-slate-500 text-sm">Answer a few quick questions to get priority access to the Live Pitch Room beta.</p>
      </div>
    </div>

    <form id="surveyForm" class="space-y-6">
      <div class="space-y-2">
        <label class="block text-sm font-bold text-slate-700">What kind of pitching do you do most often?</label>
        <select name="pitch_type" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 text-slate-700 appearance-none">
          <option value="" disabled selected>Select an option...</option>
          <option value="Startup Founder">Startup Founder</option>
          <option value="Sales Professional">Sales Professional</option>
          <option value="Creator / Freelancer">Creator / Freelancer</option>
          <option value="Student / Hackathon Participant">Student / Hackathon Participant</option>
        </select>
      </div>

      <div class="space-y-3">
        <label class="block text-sm font-bold text-slate-700">What is your biggest frustration when practicing right now?</label>
        <div class="space-y-2">
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
            <input type="radio" name="frustration" value="Can't get objective feedback" required class="text-sky-500 focus:ring-sky-500">
            <span class="text-sm text-slate-600">Can't get objective feedback</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
            <input type="radio" name="frustration" value="Struggle with timing and pacing" class="text-sky-500 focus:ring-sky-500">
            <span class="text-sm text-slate-600">Struggle with timing and pacing</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
            <input type="radio" name="frustration" value="Get nervous and forget talking points" class="text-sky-500 focus:ring-sky-500">
            <span class="text-sm text-slate-600">Get nervous and forget talking points</span>
          </label>
          <label class="flex items-center gap-3 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
            <input type="radio" name="frustration" value="Other" class="text-sky-500 focus:ring-sky-500">
            <span class="text-sm text-slate-600">Other</span>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label class="block text-sm font-bold text-slate-700">When is your next high-stakes pitch or presentation?</label>
        <select name="next_pitch" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500/20 text-slate-700 appearance-none">
          <option value="" disabled selected>Select timeframe...</option>
          <option value="Within 7 days">Within 7 days</option>
          <option value="This month">This month</option>
          <option value="Just looking around for now">Just looking around for now</option>
        </select>
      </div>



      <button type="submit" id="submitBtn" class="w-full py-4 bg-sky-500 text-white font-bold rounded-xl hover:bg-sky-600 transition-all shadow-lg shadow-sky-500/30 flex items-center justify-center gap-2">
        Submit VIP Survey
      </button>
    </form>

    <div id="successMessage" class="hidden text-center py-8">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 mb-2">Thank you!</h2>
      <p class="text-slate-500 mb-6">Your VIP status has been confirmed. We'll be in touch soon.</p>

      <div class="border-t border-slate-100 pt-6">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Follow us for updates & info</p>
        <div class="flex flex-wrap justify-center gap-3">
          <a href="https://x.com/PitchNest" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-slate-900 text-white text-sm font-semibold rounded-xl hover:bg-slate-800 transition-all shadow-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            Twitter / X
          </a>
          <a href="https://linkedin.com/company/pitchnest" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-[#0A66C2] text-white text-sm font-semibold rounded-xl hover:bg-[#004182] transition-all shadow-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            LinkedIn
          </a>
          <a href="https://instagram.com/pitchnest" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-r from-[#f09433] via-[#e6683c] to-[#bc1888] text-white text-sm font-semibold rounded-xl hover:opacity-90 transition-all shadow-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            Instagram
          </a>
          <a href="https://tiktok.com/@pitchnest" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-black text-white text-sm font-semibold rounded-xl hover:bg-gray-900 transition-all shadow-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 0010.86 4.46V13.2a8.16 8.16 0 005.58 2.17v-3.44a4.85 4.85 0 01-1-.1 4.83 4.83 0 01-3.77-4.25V6.69h4.77z"/></svg>
            TikTok
          </a>
          <a href="https://facebook.com/pitchnest" target="_blank" class="flex items-center gap-2 px-4 py-2.5 bg-[#1877F2] text-white text-sm font-semibold rounded-xl hover:bg-[#0d65d9] transition-all shadow-sm">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://oyztdulmyuklorbudcgb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_CaLHgxSy5OIXZWdYmViKkw_VGopUFjN';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const form = e.target;
      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Submitting...';
      btn.disabled = true;
      
      try {
        const formData = new FormData(form);
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        
        const payload = {
          email: email || 'unknown',
          pitch_type: formData.get('pitch_type'),
          frustration: formData.get('frustration'),
          next_pitch: formData.get('next_pitch')
        };
        
        // Upsert into Supabase 'waitlist' table (updates if email already exists)
        const { data, error } = await supabaseClient
          .from('waitlist')
          .upsert([payload], { onConflict: 'email' });
          
        if (error) throw error;
        
        // Hide form, header, and show success
        form.classList.add('hidden');
        document.getElementById('surveyHeader').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');
        
      } catch (error) {
        console.error('Error submitting survey:', error);
        alert('There was a problem saving your survey. Please try again.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
